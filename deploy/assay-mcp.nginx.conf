# TLS terminator for the public ASSAY MCP endpoint.
# Install to /etc/nginx/sites-available/assay-mcp and symlink into sites-enabled.
#
# WHY. The MCP server was published on http://170.106.175.243:7379/sse -- an IP literal, no TLS.
# Everything an MCP client sent, including the addresses being audited, crossed the network in
# cleartext and was trivially interceptable. An audit tool that publishes an unauthenticated
# cleartext endpoint is making the same category of mistake it catches in other people.

server {
    listen 80;
    listen [::]:80;
    server_name assay-mcp.sonar.my.id;

    # Certbot's webroot challenge, then everything else to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name assay-mcp.sonar.my.id;

    ssl_certificate     /etc/letsencrypt/live/sonar.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonar.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # An MCP client opens a long-lived SSE stream and posts messages back on a second request.
    # The defaults break both: proxy_buffering holds events until a buffer fills, so the client
    # sees nothing and times out, and the 60s read timeout kills an idle-but-healthy stream.
    location / {
        proxy_pass http://127.0.0.1:7379;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter reads this. It is only honoured because the unit sets
        # MCP_TRUSTED_PROXIES=127.0.0.1 -- without that pairing, any client could send its own
        # X-Forwarded-For and appear as a fresh IP on every request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;

        # The server enforces its own 64KB body cap; this fails oversized requests at the edge
        # so they never reach node.
        client_max_body_size 256k;
    }

    access_log /var/log/nginx/assay-mcp.access.log;
    error_log  /var/log/nginx/assay-mcp.error.log;
}

# ------------------------------------------------------------------------------------------------
# ALTERNATIVE, used while assay-mcp.sonar.my.id has no DNS A record yet.
#
# Mounts the MCP under a path on the EXISTING sonar.my.id certificate, which needs no new DNS and
# no new cert. Add this location block to /etc/nginx/sites-available/sonar, and set
# MCP_PUBLIC_PATH=/assay-mcp in the unit so the SSE transport advertises the prefixed POST path
# (it sends an absolute path, so a bare /messages would land on whatever else lives at the root).
#
#     location /assay-mcp/ {
#         proxy_pass http://127.0.0.1:7379/;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_buffering off;
#         proxy_cache off;
#         proxy_read_timeout 3600s;
#         proxy_send_timeout 3600s;
#         chunked_transfer_encoding off;
#         client_max_body_size 256k;
#     }
#
# The dedicated subdomain above is preferable — a bare origin is one fewer thing for an MCP client
# to get wrong — so switch to it once DNS resolves.
# ------------------------------------------------------------------------------------------------
