# TLS terminator for the public ASSAY MCP endpoint: https://sonar.my.id/assay-mcp/
#
# WHY. The MCP server was published on http://170.106.175.243:7379/sse -- an IP literal, no TLS.
# Everything an MCP client sent, including the addresses being audited, crossed the network in
# cleartext and was trivially interceptable. An audit tool that publishes an unauthenticated
# cleartext endpoint is making the same category of mistake it catches in other people.
#
# THIS FILE IS THE LIVE ROUTE, not an alternative to it. Its previous version made a server block
# for assay-mcp.sonar.my.id the primary config, but that name has no DNS record; the endpoint in the
# agent card and the README has always been this location on the sonar.my.id certificate, and it
# existed only as a hand edit on the host. Rebuilding from the repo did not restore it.
#
# Two parts, because nginx allows rate-limit zones only in http{} and a location only in server{}:
#
#   sudo sed -n '/^# BEGIN http/,/^# END http/p'     deploy/assay-mcp.nginx.conf \
#     | sudo tee /etc/nginx/conf.d/assay-mcp-limits.conf
#   sudo sed -n '/^# BEGIN server/,/^# END server/p' deploy/assay-mcp.nginx.conf \
#     | sudo tee /etc/nginx/snippets/assay-mcp.conf
#
# then, in the 443 server block of /etc/nginx/sites-available/sonar, replace the inline
# `location /assay-mcp/ { ... }` with `include snippets/assay-mcp.conf;` and run
# `sudo nginx -t && sudo systemctl reload nginx`. conf.d/*.conf is included inside http{} by the
# stock Ubuntu nginx.conf (checked on the host, nginx 1.24).
#
# Drift check: both installed files must equal their part of this one.
#   diff <(sed -n '/^# BEGIN http/,/^# END http/p' deploy/assay-mcp.nginx.conf) /etc/nginx/conf.d/assay-mcp-limits.conf
#   diff <(sed -n '/^# BEGIN server/,/^# END server/p' deploy/assay-mcp.nginx.conf) /etc/nginx/snippets/assay-mcp.conf

# BEGIN http -- /etc/nginx/conf.d/assay-mcp-limits.conf
#
# A backstop behind the server's own per-IP limits (src/mcp/ratelimit.ts: 30 SSE opens and 60
# POSTs a minute, 6 open streams), set above them so a normal client meets the server's JSON 429
# first. What these add is that a flood is refused here, before it costs node anything.
limit_conn_zone $binary_remote_addr zone=assay_mcp_streams:10m;
limit_req_zone  $binary_remote_addr zone=assay_mcp_open:10m rate=60r/m;
limit_req_zone  $binary_remote_addr zone=assay_mcp_calls:10m rate=180r/m;
# END http

# BEGIN server -- /etc/nginx/snippets/assay-mcp.conf, included in the sonar.my.id 443 server block
location /assay-mcp/ {
    # The server block's own add_header lines stop applying to any location that sets one, so the
    # headers this endpoint relies on are stated here rather than borrowed from another project's
    # config. Nested locations below inherit them.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE, not $proxy_add_x_forwarded_for.
    #
    # Appending keeps whatever the client sent and puts the real address after it, so the
    # leftmost entry stays attacker-authored. Measured against this exact stack: 42 bursted
    # connections with no header gave 29 allowed / 13 limited; the same burst with a rotating
    # X-Forwarded-For gave ZERO 429s. There is one hop here and it is this proxy, so the only
    # honest value is the peer address. The server independently reads the RIGHTMOST entry, so
    # it is correct either way -- belt and braces, because these two files get edited apart.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # An MCP client opens a long-lived SSE stream and posts messages back on a second request.
    # The defaults break both: proxy_buffering holds events until a buffer fills, so the client
    # sees nothing and times out, and the 60s read timeout kills an idle-but-healthy stream.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding off;

    # The server enforces its own 64KB body cap; this fails oversized requests at the edge
    # so they never reach node.
    client_max_body_size 256k;

    limit_req_status 429;
    limit_conn_status 429;

    # /health, /findings.json and anything added later.
    limit_req zone=assay_mcp_calls burst=60 nodelay;
    proxy_pass http://127.0.0.1:7379/;

    # The stream. Each one holds a connection for up to an hour, so it is the one worth capping
    # by count as well as by rate.
    location /assay-mcp/sse {
        limit_conn assay_mcp_streams 8;
        limit_req zone=assay_mcp_open burst=20 nodelay;
        proxy_pass http://127.0.0.1:7379/sse;
    }

    # The JSON-RPC calls, routed by ?sessionId=, which proxy_pass carries through unchanged.
    location /assay-mcp/messages {
        limit_req zone=assay_mcp_calls burst=60 nodelay;
        proxy_pass http://127.0.0.1:7379/messages;
    }
}
# END server

# ------------------------------------------------------------------------------------------------
# LATER: a dedicated subdomain, once assay-mcp.sonar.my.id resolves (it does not yet). A bare
# origin is one fewer thing for an MCP client to get wrong. It would be a 443 server block using
# the sonar.my.id certificate with the location above mounted at `/` (proxy_pass to
# http://127.0.0.1:7379 with no URI and the nested paths without the prefix), plus a port-80
# block that serves /.well-known/acme-challenge/ from /var/www/html and redirects the rest.
# MCP_PUBLIC_PATH is then removed from deploy/assay-mcp.service.
# ------------------------------------------------------------------------------------------------
